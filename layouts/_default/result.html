<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Analysis - HowWeak - Password Security Check</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.analysis-container {
  max-width: 800px;
  margin: 60px auto;
  padding: 0 20px;
}

.score-box {
  background: rgba(22, 27, 34, 0.6);
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 40px;
  margin-bottom: 30px;
  text-align: center;
}

.score-circle {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  border: 8px solid;
}

.score-excellent { border-color: #2ecc71; color: #2ecc71; }
.score-good { border-color: #27ae60; color: #27ae60; }
.score-fair { border-color: #f39c12; color: #f39c12; }
.score-poor { border-color: #e74c3c; color: #e74c3c; }

.checks-section {
  background: rgba(22, 27, 34, 0.6);
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 35px;
  margin-bottom: 30px;
}

.check-item {
  display: flex;
  align-items: center;
  padding: 15px;
  margin-bottom: 12px;
  background: rgba(22, 27, 34, 0.8);
  border: 1px solid #30363d;
  border-radius: 8px;
  gap: 15px;
}

.check-icon {
  font-size: 1.5rem;
  width: 35px;
  text-align: center;
  flex-shrink: 0;
}

.check-pass { color: #2ecc71; }
.check-fail { color: #e74c3c; }

.check-text {
  flex: 1;
  color: #c9d1d9;
  font-size: 1.05rem;
}

.recommendations-section {
  background: rgba(22, 27, 34, 0.6);
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 35px;
  margin-bottom: 30px;
}

.recommendation-item {
  padding: 18px;
  margin-bottom: 12px;
  border-radius: 8px;
  border-left: 4px solid;
  font-size: 1.05rem;
  line-height: 1.7;
}

.rec-critical {
  background: rgba(231, 76, 60, 0.1);
  border-color: #e74c3c;
  color: #e74c3c;
}

.rec-warning {
  background: rgba(243, 156, 18, 0.1);
  border-color: #f39c12;
  color: #f39c12;
}

.rec-info {
  background: rgba(52, 152, 219, 0.1);
  border-color: #3498db;
  color: #3498db;
}

.rec-success {
  background: rgba(46, 204, 113, 0.1);
  border-color: #2ecc71;
  color: #2ecc71;
}

.btn-primary {
  background: #238636;
  border: 1px solid rgba(240, 246, 252, 0.1);
  color: #ffffff;
  font-weight: 600;
  padding: 14px 32px;
  border-radius: 6px;
  transition: all 0.2s ease;
  text-decoration: none;
  display: inline-block;
  margin: 10px;
}

.btn-primary:hover {
  background: #2ea043;
  color: #ffffff;
  text-decoration: none;
}

h2 {
  color: #c9d1d9;
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 25px;
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg container-fluid">
  <a class="navbar-brand" href="/">
    <img src="/img/logo.png" alt="HowWeak Logo" class="nav-logo">
  </a>
  <button class="navbar-toggler" style="border: 1px solid #30363d;" data-bs-toggle="collapse" data-bs-target="#nav">
    <span style="color: #FFA500;">☰</span>
  </button>
  <div class="collapse navbar-collapse" id="nav">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="/tips/">Security Tips</a></li>
      <li class="nav-item"><a class="nav-link" href="/costs/">Costs</a></li>
      <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
      <li class="nav-item"><a class="nav-link" href="/research/">Research</a></li>
      <li class="nav-item"><a class="nav-link" href="/impressum/">Impressum</a></li>
    </ul>
  </div>
</nav>

<div class="analysis-container">

  <!-- Score Display -->
  <div class="score-box">
    <h1 style="font-size: 2rem; margin-bottom: 25px; color: #c9d1d9;">Password Security Analysis</h1>
    <div class="score-circle" id="scoreCircle">
      <span id="scoreValue">0</span>
    </div>
    <p style="color: #8b949e; font-size: 1.1rem; margin-top: 15px;" id="scoreLabel">Calculating...</p>
  </div>

  <!-- Security Checks -->
  <div class="checks-section">
    <h2>Security Criteria</h2>
    <div id="checksContainer">
      <!-- Checks will be inserted here -->
    </div>
  </div>

  <!-- Recommendations -->
  <div class="recommendations-section" id="recommendationsSection">
    <h2>Recommendations</h2>
    <div id="recommendationsContainer">
      <!-- Recommendations will be inserted here -->
    </div>
  </div>

  <!-- Actions -->
  <div style="text-align: center; margin-top: 40px;">
    <a href="/" class="btn btn-primary">Check Another Password</a>
    <a href="/tips/" class="btn btn-primary">View Security Tips</a>
  </div>

</div>

<footer>
  © 2026 HowWeak · Open Source Password Security
</footer>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const analysisData = localStorage.getItem('passwordAnalysis');

  if (!analysisData) {
    window.location.href = '/';
    return;
  }

  const analysis = JSON.parse(analysisData);
  displayAnalysis(analysis);
});

function displayAnalysis(analysis) {
  // Display score
  const scoreValue = document.getElementById('scoreValue');
  const scoreCircle = document.getElementById('scoreCircle');
  const scoreLabel = document.getElementById('scoreLabel');

  scoreValue.innerText = analysis.score;

  // Set score color and label
  if (analysis.score >= 85) {
    scoreCircle.className = 'score-circle score-excellent';
    scoreLabel.innerText = 'Excellent Security';
  } else if (analysis.score >= 70) {
    scoreCircle.className = 'score-circle score-good';
    scoreLabel.innerText = 'Good Security';
  } else if (analysis.score >= 50) {
    scoreCircle.className = 'score-circle score-fair';
    scoreLabel.innerText = 'Fair Security';
  } else {
    scoreCircle.className = 'score-circle score-poor';
    scoreLabel.innerText = 'Poor Security';
  }

  // Display checks
  const checksContainer = document.getElementById('checksContainer');
  const entropyBits = analysis.entropy ? Math.round(analysis.entropy * 10) / 10 : 0;

  const checks = [];

  // Breach database check - different message for offline mode
  if (analysis.offlineMode) {
    checks.push({
      condition: null,
      text: 'Breach database check skipped (offline mode enabled)',
      neutral: true
    });
  } else {
    checks.push({
      condition: !analysis.isKnownWeak,
      text: 'Not found in known weak password databases',
      critical: true
    });
  }

  checks.push(
    { condition: analysis.length >= 12, text: `Password length: ${analysis.length} characters` },
    { condition: entropyBits >= 60, text: `Password entropy: ${entropyBits} bits` },
    { condition: analysis.hasUpper, text: 'Contains uppercase letters (A-Z)' },
    { condition: analysis.hasLower, text: 'Contains lowercase letters (a-z)' },
    { condition: analysis.hasNumber, text: 'Contains numbers (0-9)' },
    { condition: analysis.hasSpecial, text: 'Contains special characters (!@#$%...)' },
    { condition: !analysis.hasRepeatingChars, text: 'No repeating character patterns' },
    { condition: !analysis.hasSequentialNumbers, text: 'No sequential number patterns' }
  );

  checks.forEach(check => {
    const div = document.createElement('div');
    div.className = 'check-item';

    // Neutral check (offline mode)
    if (check.neutral) {
      div.style.borderColor = '#8b949e';
      div.style.backgroundColor = 'rgba(139, 148, 158, 0.1)';
      div.innerHTML = `
        <div class="check-icon" style="background: #8b949e; color: #0d1117;">
          ℹ
        </div>
        <div class="check-text">${check.text}</div>
      `;
    } else {
      // Highlight critical checks (known weak password)
      if (check.critical && !check.condition) {
        div.style.borderColor = '#e74c3c';
        div.style.backgroundColor = 'rgba(231, 76, 60, 0.1)';
      }

      div.innerHTML = `
        <div class="check-icon ${check.condition ? 'check-pass' : 'check-fail'}">
          ${check.condition ? '✓' : '✗'}
        </div>
        <div class="check-text">${check.text}</div>
      `;
    }

    checksContainer.appendChild(div);
  });

  // Display recommendations
  const recommendationsContainer = document.getElementById('recommendationsContainer');

  if (analysis.recommendations.length === 0) {
    const div = document.createElement('div');
    div.className = 'recommendation-item rec-success';
    div.innerHTML = '✓ No recommendations - your password meets security standards!';
    recommendationsContainer.appendChild(div);
  } else {
    analysis.recommendations.forEach(rec => {
      const div = document.createElement('div');
      div.className = `recommendation-item rec-${rec.type}`;

      let icon = '⚠';
      if (rec.type === 'critical') icon = '✗';
      if (rec.type === 'info') icon = 'ℹ';
      if (rec.type === 'success') icon = '✓';

      div.innerHTML = `${icon} ${rec.message}`;
      recommendationsContainer.appendChild(div);
    });
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
