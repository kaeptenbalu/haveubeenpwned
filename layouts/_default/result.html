<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Result - HowWeak - Password Security Check</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.results-box {
  background: rgba(22, 27, 34, 0.6);
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 50px;
  margin: 60px auto;
  max-width: 700px;
  text-align: center;
}

.rating-display {
  font-size: 4rem;
  font-weight: 700;
  margin: 30px 0;
  font-family: 'JetBrains Mono', monospace;
}

.rating-weak {
  color: #e74c3c;
}

.rating-medium {
  color: #f39c12;
}

.rating-strong {
  color: #2ecc71;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 20px;
  margin: 40px 0;
}

.stat-item {
  background: rgba(22, 27, 34, 0.8);
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 20px;
}

.stat-number {
  font-size: 2rem;
  font-weight: 700;
  color: #FFA500;
  font-family: 'JetBrains Mono', monospace;
}

.stat-label {
  color: #8b949e;
  font-size: 0.9rem;
  margin-top: 8px;
}

.complexity-badge {
  display: inline-block;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: 600;
  margin: 10px 0;
}

.complexity-low {
  background: rgba(231, 76, 60, 0.2);
  border: 1px solid #e74c3c;
  color: #e74c3c;
}

.complexity-medium {
  background: rgba(243, 156, 18, 0.2);
  border: 1px solid #f39c12;
  color: #f39c12;
}

.complexity-high {
  background: rgba(46, 204, 113, 0.2);
  border: 1px solid #2ecc71;
  color: #2ecc71;
}

.btn-primary {
  background: #238636;
  border: 1px solid rgba(240, 246, 252, 0.1);
  color: #ffffff;
  font-weight: 600;
  padding: 14px 32px;
  border-radius: 6px;
  transition: all 0.2s ease;
  text-decoration: none;
  display: inline-block;
  margin: 10px;
}

.btn-primary:hover {
  background: #2ea043;
  color: #ffffff;
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg container-fluid">
  <a class="navbar-brand" href="/">
    <img src="/img/logo.png" alt="HowWeak Logo" class="nav-logo">
  </a>
  <button class="navbar-toggler" style="border: 1px solid #30363d;" data-bs-toggle="collapse" data-bs-target="#nav">
    <span style="color: #FFA500;">☰</span>
  </button>
  <div class="collapse navbar-collapse" id="nav">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="/tips/">Security Tips</a></li>
      <li class="nav-item"><a class="nav-link" href="/roadmap/">Roadmap</a></li>
      <li class="nav-item"><a class="nav-link" href="/costs/">Costs</a></li>
      <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
      <li class="nav-item"><a class="nav-link" href="/research/">Research</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <div class="results-box" id="resultsBox">
    <h2 style="color: #c9d1d9; font-size: 1.8rem; margin-bottom: 20px;">Password Analysis Result</h2>

    <div class="rating-display" id="ratingDisplay">
      Loading...
    </div>

    <div class="complexity-badge" id="complexityBadge">
      Loading...
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-number" id="lengthStat">0</div>
        <div class="stat-label">Length</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="numberStat">✗</div>
        <div class="stat-label">Numbers</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="specialStat">✗</div>
        <div class="stat-label">Special Chars</div>
      </div>
    </div>

    <div style="margin-top: 40px;">
      <a href="/" class="btn btn-primary">Check Another Password</a>
      <a href="/tips/" class="btn btn-primary">View Security Tips</a>
    </div>
  </div>
</div>

<footer>
  © 2026 HowWeak · Open Source Password Security
</footer>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const resultsData = localStorage.getItem('bulkResults');

  if (resultsData) {
    const results = JSON.parse(resultsData);
    if (results.length > 0) {
      const result = results[0]; // Get first (and only) result for single password check
      displayResult(result);
    }
  } else {
    // No results, redirect to home
    window.location.href = '/';
  }
});

function displayResult(result) {
  // Display rating
  const ratingDisplay = document.getElementById('ratingDisplay');
  ratingDisplay.innerText = result.rating;
  ratingDisplay.className = 'rating-display rating-' + result.rating.toLowerCase();

  // Display complexity
  const complexityBadge = document.getElementById('complexityBadge');
  complexityBadge.innerText = result.complexity.charAt(0).toUpperCase() + result.complexity.slice(1) + ' Complexity';
  complexityBadge.className = 'complexity-badge complexity-' + result.complexity;

  // Display stats
  document.getElementById('lengthStat').innerText = result.length;
  document.getElementById('numberStat').innerText = result.hasNumber ? '✓' : '✗';
  document.getElementById('specialStat').innerText = result.hasSpecial ? '✓' : '✗';

  // Color the stats
  document.getElementById('numberStat').style.color = result.hasNumber ? '#2ecc71' : '#e74c3c';
  document.getElementById('specialStat').style.color = result.hasSpecial ? '#2ecc71' : '#e74c3c';
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
