<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background: #0d1117;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-top: 1px;
      padding-bottom: 1px;
    }

    .navbar-brand {
      font-weight: bold;
      color: white !important;
      font-size: 1.5rem;
    }

    .nav-logo {
      height: 350px;
      width: auto;
    }


    .container {
      max-width: 900px;
      margin-top: 80px;
      padding: 40px;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 30px;
      color: white;
      text-shadow: 0 0 20px rgba(88,166,255,0.2);
    }

    h2 {
      margin-top: 40px;
      font-size: 1.8rem;
      color: #58a6ff;
    }

    p, li {
      font-size: 1.3rem;
      line-height: 1.7;
      color: #c9d1d9;
    }

    ul, ol {
      margin-top: 15px;
    }

    footer {
      margin-top: 80px;
      padding: 30px;
      text-align: center;
      color: #8b949e;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>

<body>

<nav class="navbar">
  <div class="container d-flex justify-content-between align-items-center">

    <a class="navbar-brand" href="/">
     <img src="/img/logo.png" alt="logo" class="nav-logo">  
    </a>

  </div>
</nav>

<div class="container">
  {{ .Content }}
</div>

<footer>
  © 2026 HaveUBeenPwnd
</footer>

</body>
</html>
