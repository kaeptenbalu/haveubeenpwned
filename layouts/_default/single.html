<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }} - Have U Been Pwned?</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Switzer', sans-serif;
  background-color: #030304;
  color: #f6f8fa;
  min-height: 100vh;
  padding: 40px 20px;
}
body::before {
  content: "";
  position: fixed;
  top: 70%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100vw;
  height: 100vh;
  background: radial-gradient(circle, rgba(29,114,167,0.4) 0%, transparent 70%);
  filter: blur(100px);
  z-index: -1;
}
.container {
  max-width: 900px;
}
.navbar {
  background: rgba(3,3,4,0.8);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 0.5rem 1.5rem;
  margin-bottom: 40px;
}
.nav-logo {
  height: 140px;
  width: auto;
}
.content-box {
  background: #0b0f14;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 40px;
  margin: 30px 0;
}
h1 {
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 30px;
  color: #e74c3c;
}
h2 {
  font-size: 1.8rem;
  font-weight: 600;
  margin-top: 30px;
  margin-bottom: 15px;
  color: #1d72a7;
}
p, li {
  font-size: 1.1rem;
  line-height: 1.7;
  color: #9cb1c2;
  margin-bottom: 15px;
}
ul {
  padding-left: 30px;
}
.warning-box {
  background: rgba(231,76,60,0.15);
  border: 2px solid #e74c3c;
  border-radius: 12px;
  padding: 30px;
  margin: 30px 0;
  text-align: center;
  font-size: 1.2rem;
}
.results-box {
  background: #0b0f14;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 30px;
  margin: 30px 0;
  display: none;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin: 20px 0;
}
.stat-item {
  background: rgba(29,114,167,0.1);
  border-radius: 8px;
  padding: 15px;
  text-align: center;
}
.stat-number {
  font-size: 2rem;
  font-weight: 700;
  color: #1d72a7;
}
.stat-label {
  color: #9cb1c2;
  font-size: 0.85rem;
  margin-top: 5px;
}
table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
}
th {
  background: rgba(29,114,167,0.2);
  padding: 12px;
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid rgba(255,255,255,0.1);
}
td {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
tr:hover {
  background: rgba(255,255,255,0.02);
}
.badge-weak {
  background: #e74c3c;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
}
.badge-medium {
  background: #f39c12;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
}
.badge-strong {
  background: #2ecc71;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
}
.btn-primary {
  background: #1d72a7;
  border: none;
  padding: 12px 30px;
  border-radius: 8px;
  font-weight: 600;
  margin: 10px;
}
.btn-primary:hover {
  background: #2a8fd6;
}
footer {
  margin-top: 80px;
  padding: 30px;
  text-align: center;
  color: #9cb1c2;
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg container mt-3">
  <a class="navbar-brand" href="/">
    <img src="/img/logo.png" alt="logo" class="nav-logo">
  </a>
  <button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#nav"></button>
  <div class="collapse navbar-collapse" id="nav">
    <ul class="navbar-nav mx-auto">
      <li class="nav-item"><a class="nav-link" href="/bulk/">Bulk Check</a></li>
      <li class="nav-item"><a class="nav-link" href="/roadmap/">Roadmap</a></li>
      <li class="nav-item"><a class="nav-link" href="/costs/">Costs</a></li>
      <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
      <li class="nav-item"><a class="nav-link" href="/research/">Research</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <div class="content-box">
    {{ .Content }}
  </div>

  <!-- Analysis Results -->
  <div class="results-box" id="resultsBox">
    <h2>Your Password Analysis</h2>

    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-number" id="totalPasswords">0</div>
        <div class="stat-label">Passwords</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="weakCount" style="color: #e74c3c;">0</div>
        <div class="stat-label">Weak</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="mediumCount" style="color: #f39c12;">0</div>
        <div class="stat-label">Medium</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="strongCount" style="color: #2ecc71;">0</div>
        <div class="stat-label">Strong</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="avgLength">0</div>
        <div class="stat-label">Avg. Length</div>
      </div>
    </div>

    <div style="text-align: center; margin: 20px 0;">
      <button class="btn btn-primary" onclick="downloadResults()">Download Results (CSV)</button>
      <button class="btn btn-primary" onclick="clearResults()">Clear</button>
    </div>

    <div style="overflow-x: auto;">
      <table id="resultsTable">
        <thead>
          <tr>
            <th>Username</th>
            <th>Password</th>
            <th>Length</th>
            <th>Has Numbers</th>
            <th>Has Special</th>
            <th>Complexity</th>
            <th>Rating</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
        </tbody>
      </table>
    </div>
  </div>

  <div style="text-align: center; margin-top: 40px;">
    <a href="/" class="btn btn-primary">Check Another Password</a>
    <a href="/research/" class="btn btn-primary">View Statistics</a>
  </div>
</div>

<footer>
  © 2026 HaveUBeenPwnd
</footer>

<script>
// Load results from localStorage
window.addEventListener('DOMContentLoaded', () => {
  const resultsData = localStorage.getItem('bulkResults');

  if (resultsData) {
    const results = JSON.parse(resultsData);
    displayResults(results);
  }
});

function displayResults(results) {
  document.getElementById('resultsBox').style.display = 'block';

  let weak = 0, medium = 0, strong = 0, totalLength = 0;

  results.forEach(r => {
    if (r.rating === 'Weak') weak++;
    else if (r.rating === 'Medium') medium++;
    else strong++;
    totalLength += r.length;
  });

  document.getElementById('totalPasswords').innerText = results.length;
  document.getElementById('weakCount').innerText = weak;
  document.getElementById('mediumCount').innerText = medium;
  document.getElementById('strongCount').innerText = strong;
  document.getElementById('avgLength').innerText = (totalLength / results.length).toFixed(1);

  const tbody = document.getElementById('resultsBody');
  tbody.innerHTML = '';

  results.forEach(result => {
    const row = tbody.insertRow();
    row.innerHTML = `
      <td>${result.username}</td>
      <td>${'*'.repeat(result.length)}</td>
      <td>${result.length}</td>
      <td>${result.hasNumber ? '✓' : '✗'}</td>
      <td>${result.hasSpecial ? '✓' : '✗'}</td>
      <td>${result.complexity}</td>
      <td><span class="badge-${result.rating.toLowerCase()}">${result.rating}</span></td>
    `;
  });
}

function downloadResults() {
  const resultsData = localStorage.getItem('bulkResults');
  if (!resultsData) return;

  const results = JSON.parse(resultsData);
  let csv = 'Username;Password Length;Has Numbers;Has Special;Complexity;Rating\n';

  results.forEach(r => {
    csv += `${r.username};${r.length};${r.hasNumber};${r.hasSpecial};${r.complexity};${r.rating}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'password-analysis-results.csv';
  a.click();
  window.URL.revokeObjectURL(url);
}

function clearResults() {
  localStorage.removeItem('bulkResults');
  document.getElementById('resultsBox').style.display = 'none';
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
