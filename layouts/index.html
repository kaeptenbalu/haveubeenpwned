<!DOCTYPE html>

<style>

  font-family: 'Switzer', sans-serif;

/* Glow Background */

}

.nav-link:hover {

}

.nav-logo {

/* ===== HERO ===== */

  padding: 80px 20px;

.hero-logo {

/* ===== INPUT ===== */

  background: #0b0f14;
  border: 1px solid rgba(255,255,255,0.1);

.form-control {

  padding: 18px;
}

.form-control:focus {
  box-shadow: none;
  background: transparent;
  color: white;
}

  background: #1d72a7;
  border: none;
}

  background: #2a8fd6;
}

/* ===== CARD (STATS) ===== */

  background: #0b0f14;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  box-shadow: 0 0 40px rgba(29,114,167,0.15);
}

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg container mt-3">
  <a class="navbar-brand" href="/">
    <img src="https://raw.githubusercontent.com/kaeptenbalu/haveubeenpwned/refs/heads/main/static/img/logo.png" class="nav-logo">

    <ul class="navbar-nav mx-auto">

      <li class="nav-item"><a class="nav-link" href="#">About</a></li>
    </ul>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="container">

    <!-- Dein Logo -->
    <img src="https://raw.githubusercontent.com/kaeptenbalu/haveubeenpwned/refs/heads/main/static/img/logo.png" class="hero-logo">

    <p>Check if your password is in a data breach</p>

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="input-group-custom d-flex">

          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter password"
          >

          <button class="btn btn-primary px-4" onclick="submitPassword()">
            Check
          </button>

        </div>

      </div>
    </div>

  </div>
</section>

<!-- STATS -->
<section class="pb-4">
  <div class="container">
    <div class="row justify-content-center">

      <div class="col-md-4">
        <div class="card text-center p-4">

          <div class="display-5" id="pwnedCount">...</div>
          <p class="text-primary mb-0">passwords</p>

        </div>
      </div>

    </div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  © 2026 Awareness Project
</footer>

<!-- SCRIPT -->
<script>

// ===== PASSWORD ANALYSIS =====
function analyzePassword(pw) {

  const payload = {
    length: pw.length,
    has_number: /\d/.test(pw),
    has_special: /[^A-Za-z0-9]/.test(pw)
  };

  return fetch("https://muddy-scene-9bdf.haveubeenpwned.workers.dev/analyze", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
}

// ===== SUBMIT =====
async function submitPassword() {
  const pw = document.getElementById("password").value;

  if (!pw) {
    alert("Enter password");
    return;
  }

  try {
    await analyzePassword(pw);
  } catch(e) {
    console.error(e);
  }

  setTimeout(() => {
    window.location.href = "/awareness/";
  }, 700);
}

// ===== ENTER KEY =====
document.getElementById("password").addEventListener("keypress", e => {
  if (e.key === "Enter") submitPassword();
});

// ===== LOAD STATS =====
async function loadStats() {
  try {
    const res = await fetch("https://muddy-scene-9bdf.haveubeenpwned.workers.dev/stats");
    const data = await res.json();

    document.getElementById("pwnedCount").innerText = data.total.toLocaleString();

  } catch(e) {
    console.error("Stats error:", e);
    document.getElementById("pwnedCount").innerText = "0";
  }
}

loadStats();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
