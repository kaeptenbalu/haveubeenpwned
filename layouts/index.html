<script>

// ===== CALCULATE ENTROPY =====
function calculateEntropy(pw) {
  if (!pw) return 0;

  // Count character set size
  let charsetSize = 0;
  if (/[a-z]/.test(pw)) charsetSize += 26; // lowercase
  if (/[A-Z]/.test(pw)) charsetSize += 26; // uppercase
  if (/\d/.test(pw)) charsetSize += 10;    // digits
  if (/[^A-Za-z0-9]/.test(pw)) charsetSize += 33; // special chars (approx)

  // Shannon entropy: H = L * log2(N)
  // where L = password length, N = character set size
  const entropy = pw.length * Math.log2(charsetSize);
  return entropy;
}

// ===== HASH PASSWORD =====
async function hashPassword(pw) {
  const encoder = new TextEncoder();
  const data = encoder.encode(pw);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  return hashHex;
}

// ===== CHECK WEAK PASSWORD =====
async function checkWeakPassword(hash) {
  try {
    const response = await fetch("https://withered-cake-20e4.howweak-api.workers.dev/check", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ hash: hash })
    });
    const result = await response.json();
    return result.isWeak || false;
  } catch(e) {
    console.error("Failed to check weak password:", e);
    return false; // Don't penalize on API error
  }
}

// ===== SUBMIT =====
async function submitPassword() {
  try {
    const pw = document.getElementById("password").value;
    const offlineMode = document.getElementById("offlineMode").checked;

    if (!pw) {
      alert("Enter password");
      return;
    }

    // Generate hash and check against weak password list (only if not in offline mode)
    let isKnownWeak = false;
    if (!offlineMode) {
      const hash = await hashPassword(pw);
      isKnownWeak = await checkWeakPassword(hash);
    }

  // Analyze password based on current security standards
  const entropy = calculateEntropy(pw);
  const analysis = {
    length: pw.length,
    entropy: entropy,
    hasUpper: /[A-Z]/.test(pw),
    hasLower: /[a-z]/.test(pw),
    hasNumber: /\d/.test(pw),
    hasSpecial: /[^A-Za-z0-9]/.test(pw),
    hasRepeatingChars: /(.)\1{2,}/.test(pw), // 3+ same chars in a row
    hasSequentialNumbers: /(012|123|234|345|456|567|678|789|890)/.test(pw),
    isKnownWeak: isKnownWeak,
    offlineMode: offlineMode,

    // Recommendations based on checks
    recommendations: []
  };

  // Check length (most important factor)
  if (pw.length < 8) {
    analysis.recommendations.push({
      type: 'critical',
      message: 'Password is too short. Use at least 8 characters, ideally 12 or more.'
    });
  } else if (pw.length < 12) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Password length is acceptable, but 12+ characters is recommended for better security.'
    });
  }

  // Check entropy (highly weighted factor)
  if (entropy < 28) {
    analysis.recommendations.push({
      type: 'critical',
      message: 'Password entropy is very low. Use a longer password with more character variety.'
    });
  } else if (entropy < 50) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Password entropy is moderate. Consider using more character types and length.'
    });
  } else if (entropy < 60) {
    analysis.recommendations.push({
      type: 'info',
      message: 'Good entropy. For excellent security, aim for 60+ bits of entropy.'
    });
  }

  // Check character variety
  if (!analysis.hasUpper) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Add uppercase letters (A-Z) to increase password strength.'
    });
  }

  if (!analysis.hasLower) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Add lowercase letters (a-z) to increase password strength.'
    });
  }

  if (!analysis.hasNumber) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Add numbers (0-9) to increase password strength.'
    });
  }

  if (!analysis.hasSpecial) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Add special characters (!@#$%^&*) to increase password strength.'
    });
  }

  // Check for patterns
  if (analysis.hasRepeatingChars) {
    analysis.recommendations.push({
      type: 'info',
      message: 'Avoid repeating characters (e.g., "aaa", "111").'
    });
  }

  if (analysis.hasSequentialNumbers) {
    analysis.recommendations.push({
      type: 'info',
      message: 'Avoid sequential numbers (e.g., "123", "456").'
    });
  }

  // Overall score (0-100)
  let score = 0;

  // If password is in known weak list, score is automatically 0
  if (isKnownWeak) {
    score = 0;
    analysis.recommendations.unshift({
      type: 'critical',
      message: 'This password appears in known weak password databases. It is extremely vulnerable and should never be used!'
    });
  } else {
    // Length scoring (max 30 points)
    if (pw.length >= 8) score += 10;
    if (pw.length >= 12) score += 10;
    if (pw.length >= 16) score += 10;

    // Entropy scoring (max 40 points - highly weighted!)
    if (entropy >= 28) score += 10;
    if (entropy >= 40) score += 10;
    if (entropy >= 50) score += 10;
    if (entropy >= 60) score += 10;

    // Character variety (max 25 points)
    if (analysis.hasUpper) score += 6;
    if (analysis.hasLower) score += 6;
    if (analysis.hasNumber) score += 6;
    if (analysis.hasSpecial) score += 7;

    // Pattern penalties/bonuses (max 5 points)
    if (!analysis.hasRepeatingChars) score += 3;
    if (!analysis.hasSequentialNumbers) score += 2;
  }

  analysis.score = score;

  // Add positive feedback if no recommendations
  if (analysis.recommendations.length === 0 && pw.length >= 12) {
    analysis.recommendations.push({
      type: 'success',
      message: 'Excellent! Your password meets current security standards.'
    });
  }

  localStorage.setItem('passwordAnalysis', JSON.stringify(analysis));

  // Send anonymous statistics to worker (NO password, only analysis results)
  try {
    await fetch("https://withered-cake-20e4.howweak-api.workers.dev/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        length: analysis.length,
        entropy: Math.round(analysis.entropy * 10) / 10, // round to 1 decimal
        has_upper: analysis.hasUpper,
        has_lower: analysis.hasLower,
        has_number: analysis.hasNumber,
        has_special: analysis.hasSpecial,
        has_repeating: analysis.hasRepeatingChars,
        has_sequential: analysis.hasSequentialNumbers,
        score: analysis.score,
        is_known_weak: analysis.isKnownWeak
      })
    });
  } catch(e) {
    // Don't block on stats error
    console.warn("Failed to send stats:", e);
  }

  window.location.href = "/result/";
  } catch(error) {
    console.error("Error in submitPassword:", error);
    alert("An error occurred. Please try again.");
  }
}

// ===== ENTER KEY =====
document.getElementById("password").addEventListener("keypress", e => {
  if (e.key === "Enter") submitPassword();
});

// Stats loading removed - using static number on homepage

</script>
