<!-- SCRIPT -->
<script>

// ===== SUBMIT =====
async function submitPassword() {
  const pw = document.getElementById("password").value;

  if (!pw) {
    alert("Enter password");
    return;
  }

  // Analyze password based on current security standards
  const analysis = {
    length: pw.length,
    hasUpper: /[A-Z]/.test(pw),
    hasLower: /[a-z]/.test(pw),
    hasNumber: /\d/.test(pw),
    hasSpecial: /[^A-Za-z0-9]/.test(pw),
    hasRepeatingChars: /(.)\1{2,}/.test(pw), // 3+ same chars in a row
    hasSequentialNumbers: /(012|123|234|345|456|567|678|789|890)/.test(pw),

    // Recommendations based on checks
    recommendations: []
  };

  // Check length (most important factor)
  if (pw.length < 8) {
    analysis.recommendations.push({
      type: 'critical',
      message: 'Password is too short. Use at least 8 characters, ideally 12 or more.'
    });
  } else if (pw.length < 12) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Password length is acceptable, but 12+ characters is recommended for better security.'
    });
  }

  // Check character variety
  if (!analysis.hasUpper) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Add uppercase letters (A-Z) to increase password strength.'
    });
  }

  if (!analysis.hasLower) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Add lowercase letters (a-z) to increase password strength.'
    });
  }

  if (!analysis.hasNumber) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Add numbers (0-9) to increase password strength.'
    });
  }

  if (!analysis.hasSpecial) {
    analysis.recommendations.push({
      type: 'warning',
      message: 'Add special characters (!@#$%^&*) to increase password strength.'
    });
  }

  // Check for patterns
  if (analysis.hasRepeatingChars) {
    analysis.recommendations.push({
      type: 'info',
      message: 'Avoid repeating characters (e.g., "aaa", "111").'
    });
  }

  if (analysis.hasSequentialNumbers) {
    analysis.recommendations.push({
      type: 'info',
      message: 'Avoid sequential numbers (e.g., "123", "456").'
    });
  }

  // Overall score (0-100)
  let score = 0;
  if (pw.length >= 8) score += 20;
  if (pw.length >= 12) score += 20;
  if (pw.length >= 16) score += 10;
  if (analysis.hasUpper) score += 10;
  if (analysis.hasLower) score += 10;
  if (analysis.hasNumber) score += 10;
  if (analysis.hasSpecial) score += 15;
  if (!analysis.hasRepeatingChars) score += 5;

  analysis.score = score;

  // Add positive feedback if no recommendations
  if (analysis.recommendations.length === 0 && pw.length >= 12) {
    analysis.recommendations.push({
      type: 'success',
      message: 'Excellent! Your password meets current security standards.'
    });
  }

  localStorage.setItem('passwordAnalysis', JSON.stringify(analysis));

  window.location.href = "/result/";
}

// ===== ENTER KEY =====
document.getElementById("password").addEventListener("keypress", e => {
  if (e.key === "Enter") submitPassword();
});

// Stats loading removed - using static number on homepage

</script>
