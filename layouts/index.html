<script>

// ===== PASSWORD ANALYSIS =====
function analyzePassword(pw) {

  const payload = {
    length: pw.length,
    has_number: /\d/.test(pw),
    has_special: /[^A-Za-z0-9]/.test(pw)
  };

  return fetch("https://muddy-scene-9bdf.haveubeenpwned.workers.dev/analyze", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
}

// ===== SUBMIT =====
async function submitPassword() {
  const pw = document.getElementById("password").value;

  if (!pw) {
    alert("Enter password");
    return;
  }

  try {
    // Analyze and send to worker
    await analyzePassword(pw);

    // Save single password analysis to localStorage
    const analysis = {
      length: pw.length,
      hasNumber: /\d/.test(pw),
      hasSpecial: /[^A-Za-z0-9]/.test(pw),
      hasUpper: /[A-Z]/.test(pw),
      hasLower: /[a-z]/.test(pw)
    };

    let complexity = 'low';
    if (analysis.hasNumber && analysis.hasSpecial && analysis.hasUpper && analysis.hasLower) complexity = 'high';
    else if ((analysis.hasNumber || analysis.hasSpecial) && (analysis.hasUpper || analysis.hasLower)) complexity = 'medium';

    let rating = 'Weak';
    if (pw.length >= 12 && complexity === 'high') rating = 'Strong';
    else if (pw.length >= 8 && complexity !== 'low') rating = 'Medium';

    const singleResult = [{
      username: 'Single Check',
      password: pw,
      length: pw.length,
      hasNumber: analysis.hasNumber,
      hasSpecial: analysis.hasSpecial,
      complexity: complexity,
      rating: rating
    }];

    localStorage.setItem('bulkResults', JSON.stringify(singleResult));
  } catch(e) {
    console.error(e);
  }

  setTimeout(() => {
    window.location.href = "/awareness/";
  }, 700);
}

// ===== ENTER KEY =====
document.getElementById("password").addEventListener("keypress", e => {
  if (e.key === "Enter") submitPassword();
});

// Stats loading removed - using static number on homepage

</script>
